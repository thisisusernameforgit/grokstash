stages:
  - test

backend:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir -r backend/requirements-dev.txt
    - cd backend
    - python -m pytest tests -q

frontend:
  stage: test
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
