input {
  tcp {
    # Порт приходит из .env, чтобы не расходиться с публикацией в compose
    port => "${GROKSTASH_SYSLOG_PORT:1514}"
    codec => line
  }
}

filter {
  dissect {
    mapping => {
      "message" => "%{trace_id}|%{[@metadata][grokstash_ns]}|%{log_text}"
    }
    tag_on_failure => [_grokstashfailuredissect_mainconf]
  }
  if "_grokstashfailuredissect_mainconf" not in [tags] {
    mutate {
      rename => {
        "log_text" => "message"
      }
      remove_field => ["host", "@version", "port"]
    }
    if [@metadata][grokstash_ns] and [@metadata][grokstash_ns] != "" {
      mutate {
        copy => {
          "[@metadata][grokstash_ns]" => "[@metadata][namespace]"
        }
      }
    }
  }
}

output {
  # В docker logs и во вкладку Logs пишем только то, что не разобралось
  if "_grokparsefailure" in [tags] or "_grokstashfailuredissect_mainconf" in [tags] {
    stdout {
      codec => json_lines
    }
  }
  # Обратный канал: штатный HTTP-вывод, одно событие на запрос
  http {
    url => "http://backend:4000/api/event"
    http_method => "post"
    format => "json"
    content_type => "application/json"
    keepalive => true
    connect_timeout => 3
    socket_timeout => 10
  }
}
