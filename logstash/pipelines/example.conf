filter {
  if [@metadata][namespace] == "syslog-connector" {
    mutate {
      copy => {
        "message" => "[syslog-connector][original]"
      }

    }
    mutate {
      replace => {
        "[siem][observer][class]" => "registrar"
        "[siem][observer][type]" => "Другое"
        "[siem][observer][product][name]" => "Test"
        "[siem][observer][vendor]" => "Test Company"
      }
    }

    grok {
      match => {
        "message" => "<%{NONNEGINT:[@metadata][pri]}>%{NONNEGINT:[@metadata][version]} %{TIMESTAMP_ISO8601:[@metadata][timestamp]} %{DATA:[@metadata][hostname]} %{DATA:[@metadata][app_name]} %{DATA:[@metadata][proc_id]} %{DATA:[@metadata][msgid]} \[%{DATA:[@metadata][sd_id1]} %{DATA:[@metadata][sd_params1]}\]\[%{DATA:[@metadata][sd_id2]} %{DATA:[@metadata][sd_params2]}\] %{GREEDYDATA:[@metadata][msg]}"
      }
    }

    if [@metadata][pri] {
      mutate {
        add_field => {
          "[@metadata][severity]" => "%{[@metadata][pri]}"
        }
      }
      mutate {
        gsub => [
        "[@metadata][severity]", "^.*([0-7])$", "%{1}"
        ]
      }
      translate {
        field => "[@metadata][severity]"
        destination => "[log][level]"
        override => true
        dictionary => {
          "0" => "emerg"
          "1" => "alert"
          "2" => "crit"
          "3" => "err"
          "4" => "warning"
          "5" => "notice"
          "6" => "info"
          "7" => "debug"
        }
      }
    }

    if [@metadata][timestamp] {
      date {
        match => [ "[@metadata][timestamp]", "ISO8601" ]
        target => "@timestamp"
      }
    }

    if [@metadata][hostname] {
      mutate {
        copy => {
          "[@metadata][hostname]" => "[host][name]"
        }
      }
    }

    if [@metadata][app_name] {
      mutate {
        copy => {
          "[@metadata][app_name]" => "[process][name]"
        }
      }
    }

    if [@metadata][msgid] {
      mutate {
        copy => {
          "[@metadata][msgid]" => "[siem][event][name]"
        }
      }
    }

    if [@metadata][msg] {
      mutate {
        copy => {
          "[@metadata][msg]" => "[siem][event][description]"
        }
      }
    }

    if [@metadata][sd_params1] {
      kv {
        source => "[@metadata][sd_params1]"
        target => "[@metadata][kv1]"
        field_split_pattern => "[[:space:]]+(?=[^[:space:]=]+=)"
        value_split => "="
        trim_value => "\""
      }
    }

    if [@metadata][sd_params2] {
      kv {
        source => "[@metadata][sd_params2]"
        target => "[@metadata][kv2]"
        field_split_pattern => "[[:space:]]+(?=[^[:space:]=]+=)"
        value_split => "="
        trim_value => "\""
      }
    }

    if [@metadata][kv1][ip] {
      mutate {
        copy => {
          "[@metadata][kv1][ip]" => "[source][ip]"
        }
      }
    }

    if [@metadata][kv2][ip] {
      mutate {
        copy => {
          "[@metadata][kv2][ip]" => "[source][ip]"
        }
      }
    }

    if [@metadata][kv1][user] {
      mutate {
        copy => {
          "[@metadata][kv1][user]" => "[user][name]"
        }
      }
    }

    if [@metadata][kv2][user] {
      mutate {
        copy => {
          "[@metadata][kv2][user]" => "[user][name]"
        }
      }
    }

    if [@metadata][kv1][new_user] {
      mutate {
        copy => {
          "[@metadata][kv1][new_user]" => "[user][name]"
        }
      }
    }

    if [@metadata][kv2][new_user] {
      mutate {
        copy => {
          "[@metadata][kv2][new_user]" => "[user][name]"
        }
      }
    }

    if [@metadata][kv1][result] {
      mutate {
        copy => {
          "[@metadata][kv1][result]" => "[siem][event][outcome]"
        }
      }
    }

    if [@metadata][kv2][result] {
      mutate {
        copy => {
          "[@metadata][kv2][result]" => "[siem][event][outcome]"
        }
      }
    }

    if [@metadata][kv1][status] {
      mutate {
        copy => {
          "[@metadata][kv1][status]" => "[siem][event][outcome]"
        }
      }
    }

    if [@metadata][kv2][status] {
      mutate {
        copy => {
          "[@metadata][kv2][status]" => "[siem][event][outcome]"
        }
      }
    }

    if [@metadata][kv1][filename] {
      mutate {
        copy => {
          "[@metadata][kv1][filename]" => "[file][name]"
        }
      }
    }

    if [@metadata][kv2][filename] {
      mutate {
        copy => {
          "[@metadata][kv2][filename]" => "[file][name]"
        }
      }
    }

    if [@metadata][kv1][smtp_host] {
      mutate {
        copy => {
          "[@metadata][kv1][smtp_host]" => "[destination][domain]"
        }
      }
    }

    if [@metadata][kv2][smtp_host] {
      mutate {
        copy => {
          "[@metadata][kv2][smtp_host]" => "[destination][domain]"
        }
      }
    }

    if [@metadata][kv1][url] {
      mutate {
        copy => {
          "[@metadata][kv1][url]" => "[siem][event][description]"
        }
      }
    }

    if [@metadata][kv2][url] {
      mutate {
        copy => {
          "[@metadata][kv2][url]" => "[siem][event][description]"
        }
      }
    }

    if [@metadata][kv1][method] {
      mutate {
        copy => {
          "[@metadata][kv1][method]" => "[siem][event][action]"
        }
      }
    }

    if [@metadata][kv2][method] {
      mutate {
        copy => {
          "[@metadata][kv2][method]" => "[siem][event][action]"
        }
      }
    }

    if [@metadata][kv1][path] {
      mutate {
        copy => {
          "[@metadata][kv1][path]" => "[siem][event][description]"
        }
      }
    }

    if [@metadata][kv2][path] {
      mutate {
        copy => {
          "[@metadata][kv2][path]" => "[siem][event][description]"
        }
      }
    }

    if [@metadata][kv1][target] {
      mutate {
        copy => {
          "[@metadata][kv1][target]" => "[file][path]"
        }
      }
    }

    if [@metadata][kv2][target] {
      mutate {
        copy => {
          "[@metadata][kv2][target]" => "[file][path]"
        }
      }
    }

  }
}